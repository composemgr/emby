# nginx proxy address - http://172.17.0.1:8096

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  emby:
    image: emby/embyserver:latest
    container_name: emby-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - emby
    ports:
      - "8096:8096"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./rootfs/config/emby:/config
      - ./rootfs/data/emby:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  emby:
    external: false
