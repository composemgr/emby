# nginx proxy address - http://172.17.0.1:8096

name: emby
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  emby:
    image: emby/embyserver:latest
    pull_policy: always
    container_name: emby-app
    restart: always
    logging: *default-logging
    networks:
      - emby
    ports:
      - "172.17.0.1:8096:8096"
    environment:
      TZ: ${TZ:-America/New_York}
      UID: ${SERVICE_USER:-1000}
      GID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/emby:/config
      - ./volumes/data/emby:/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  emby:
    name: emby
    external: false
